<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* Portada con altura fija */
        .card-img-top {
            height: 150px;
            object-fit: cover;
        }

        /* Sube el avatar para que quede encima de la portada */
        .profile {
            margin-top: -60px;
        }

        .profile img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 4px solid #ffffff;
        }
    </style>
</head>
<body>

<div class="d-flex justify-content-center my-5">
    <div class="card" style="width: 18rem;">

        <!-- Portada -->
        <img src="https://picsum.photos/id/1018/600/300" class="card-img-top" alt="Imagen de portada">

        <!-- Avatar superpuesto -->
        <div class="profile position-relative text-center">
            <img src="https://i.pravatar.cc/150?img=12" class="rounded-circle" alt="Foto de perfil">
        </div>

        <!-- Cuerpo -->
        <div class="card-body text-center">
            <h5 class="card-title">Benjamin Rojo Kerkebe</h5>
            <p class="card-text">
               Ingeniero de Software, apasionado por la tecnología y el desarrollo web. Siempre en busca de nuevos desafíos y oportunidades para aprender y crecer profesionalmente.
            <a href="#" class="btn btn-primary">Ver perfil</a>
        </div>

        <!-- Lista de acciones -->
        <div class="list-group list-group-flush">
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                <i class="bi bi-chat-left-text"></i> Ir a mensajes
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                <i class="bi bi-bell"></i> Notificaciones
                <span class="badge bg-danger">+99</span>
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                <i class="bi bi-people"></i> Solicitudes Pendientes
            </a>
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-2">
                <i class="bi bi-camera-video"></i> Llamar
            </a>
        </div>

    </div>
</div>

</body>
</html>
