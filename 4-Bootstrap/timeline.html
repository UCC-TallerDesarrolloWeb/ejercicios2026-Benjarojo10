<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <!-- ===== CABECERA: MESES ===== -->
    <div class="row bg-black text-white text-center fw-bold">
        <div class="col-6 py-2">Enero</div>
        <div class="col-6 py-2">Febrero</div>
    </div>

    <!-- ===== CABECERA: SEMANAS ===== -->
    <div class="row bg-black text-white text-center">
        <div class="col border border-light">Semana 1</div>
        <div class="col border border-light">Semana 2</div>
        <div class="col border border-light">Semana 3</div>
        <div class="col border border-light">Semana 4</div>
        <div class="col border border-light">Semana 1</div>
        <div class="col border border-light">Semana 2</div>
        <div class="col border border-light">Semana 3</div>
        <div class="col border border-light">Semana 4</div>
    </div>

    <!-- ===== ÍTEM 1: COMPLETED ===== -->
    <div class="row mt-4">
        <div class="col-4">
            <div class="bg-secondary text-white rounded-2 p-2 d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-info">Completed</span>
                    <p class="fw-bold fs-5 mb-0">Define Architecture</p>
                    <span class="opacity-50">20 Enero</span>
                </div>
                <div class="d-flex gap-1">
                    <img src="https://i.pravatar.cc/40?img=47" alt="Avatar" class="rounded-circle border border-light" width="35">
                    <img src="https://i.pravatar.cc/40?img=45" alt="Avatar" class="rounded-circle border border-light" width="35">
                </div>
            </div>
        </div>
    </div>

    <!-- ===== ÍTEM 2: IN PROGRESS ===== -->
    <div class="row mt-3">
        <div class="col-4 offset-3">
            <div class="bg-secondary text-white rounded-2 p-2 d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-warning">In Progress</span>
                    <p class="fw-bold fs-5 mb-0">Define Architecture</p>
                    <span class="opacity-50">20 Enero</span>
                </div>
                <div class="d-flex gap-1">
                    <img src="https://i.pravatar.cc/40?img=47" alt="Avatar" class="rounded-circle border border-light" width="35">
                    <img src="https://i.pravatar.cc/40?img=45" alt="Avatar" class="rounded-circle border border-light" width="35">
                </div>
            </div>
        </div>
    </div>

    <!-- ===== ÍTEM 3: BLOCKED ===== -->
    <div class="row mt-3 mb-5">
        <div class="col-4 offset-5">
            <div class="bg-secondary text-white rounded-2 p-2 d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-danger">Blocked</span>
                    <p class="fw-bold fs-5 mb-0">Define Architecture</p>
                    <span class="opacity-50">20 Enero</span>
                </div>
                <div class="d-flex gap-1">
                    <img src="https://i.pravatar.cc/40?img=47" alt="Avatar" class="rounded-circle border border-light" width="35">
                    <img src="https://i.pravatar.cc/40?img=45" alt="Avatar" class="rounded-circle border border-light" width="35">
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
