<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form action="#" method="post">
    <fieldset>
        <legend>Crear cuenta</legend>

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" size="40" maxlength="40" placeholder="Tu nombre">
        </p>

        <p>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" size="40" maxlength="40" placeholder="Tu apellido">
        </p>

        <p>
            Sexo:
            <input type="radio" id="masculino" name="sexo" value="masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" id="femenino" name="sexo" value="femenino">
            <label for="femenino">Femenino</label>
        </p>

        <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="0" max="120" maxlength="3" placeholder="Ej: 20">
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" size="40" maxlength="60" placeholder="ejemplo@correo.com">
        </p>

        <p>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" size="40" maxlength="20" placeholder="Nombre de usuario">
        </p>
