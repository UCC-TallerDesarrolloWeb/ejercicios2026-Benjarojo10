<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operaciones Matemáticas</title>
    <link href="https://fonts.googleapis.com/css?family=Inknut+Antiqua" rel="stylesheet">
    <link href="miEstilo.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="misFunciones.js"></script>
</head>
<body class="body-num">

<div class="centrado div-conver">
    <h1>Operaciones Matemáticas</h1>
  <form class="operacionesMat">
    <p>
        <input id="nums1" type="text" name="sum_num1" onchange="operar('s')">
        +
        <input id="nums2" type="text" name="sum_num2" onchange="operar('s')">
        =
        <span id="totalS"></span>
    </p>
    <p>
        <input id="numr1" type="text" name="res_num1" onchange="operar('r')">
        -
        <input id="numr2" type="text" name="res_num2" onchange="operar('r')">
        =
        <span id="totalR"></span>
    </p>
    <p>
        <input id="numm1" type="text" name="mul_num1" onchange="operar('m')">
        x
        <input id="numm2" type="text" name="mul_num2" onchange="operar('m')">
        =
        <span id="totalM"></span>
    </p>
    <p>
        <input id="numd1" type="text" name="div_num1" onchange="operar('d')">
        /
        <input id="numd2" type="text" name="div_num2" onchange="operar('d')">
        =
        <span id="totalD"></span>
    </p>
</form>
</div>
</body>
</html>
